<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-ar-aging: one AR ledger CSV is read by ar_ingest, then two clocks run on the same dataset - invoice_date gives age_days and one of five fixed buckets, due_date gives days_past_due and the overdue flag - and ar_export writes summary or detail CSV under DSH_HOME">

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="dsh-ar-aging pipeline">
<title>dsh-ar-aging pipeline</title>
<rect width="1200" height="400" rx="18" fill="#0d1117"/>
<text x="60" y="62" fill="#f0f6fc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="700">dsh-ar-aging</text>
<text x="60" y="94" fill="#8b949e" font-family="ui-monospace,monospace" font-size="16">ar_ingest → ar_aging → ar_export · local CSV only</text>
<line x1="60" y1="116" x2="1140" y2="116" stroke="#30363d"/>
<rect x="60" y="150" width="190" height="96" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="155" y="190" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700">ar-ledger.csv</text>
<text x="155" y="218" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11">UTF-8 · RFC 4180 · ≤20 MB</text>
<path d="M256 198h28" stroke="#8b949e" stroke-width="3"/>
<path d="M282 191l10 7-10 7" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="290" y="150" width="190" height="96" rx="14" fill="#161b22" stroke="#4B67B4" stroke-width="2"/>
<text x="385" y="190" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700">ar_ingest</text>
<text x="385" y="218" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11">validate · normalize · R0</text>
<path d="M486 198h28" stroke="#8b949e" stroke-width="3"/>
<path d="M512 191l10 7-10 7" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="520" y="150" width="190" height="96" rx="14" fill="#161b22" stroke="#4B67B4" stroke-width="2"/>
<text x="615" y="190" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700">ar_aging</text>
<text x="615" y="218" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11">0-30/31-60/61-90/91-180/180+ · R0</text>
<path d="M716 198h28" stroke="#8b949e" stroke-width="3"/>
<path d="M742 191l10 7-10 7" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="750" y="150" width="190" height="96" rx="14" fill="#161b22" stroke="#4B67B4" stroke-width="2"/>
<text x="845" y="190" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700">ar_export</text>
<text x="845" y="218" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11">layout=summary|detail · R1</text>
<path d="M946 198h28" stroke="#8b949e" stroke-width="3"/>
<path d="M972 191l10 7-10 7" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="980" y="150" width="190" height="96" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="1075" y="190" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" font-weight="700">exports/*.csv</text>
<text x="1075" y="218" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11">$DSH_HOME/dsh-ar-aging/</text>
<rect x="60" y="290" width="1080" height="52" rx="12" fill="#161b22" stroke="#4B67B4" stroke-width="2"/>
<text x="600" y="322" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14">R0 read-only: ar_ingest · ar_aging ｜ R1 local write: ar_export ｜ no network · no model call · source CSV never modified</text>
<text x="60" y="378" fill="#8b949e" font-family="ui-monospace,monospace" font-size="13">age = as_of − invoice_date (UTC days) · overdue ⟺ due_date &lt; as_of · one CSV = one currency</text>
</svg>
